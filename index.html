<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eef2ff;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .container {
            background: white;
            width: 380px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration</h2>

    <form>
        <label>Student Name</label>
        <input type="text" placeholder="Enter Student Name" required>

        <label>Roll Number</label>
        <input type="text" placeholder="Enter Roll Number" required>

        <label>Email</label>
        <input type="email" placeholder="Enter Email" required>

        <label>Course</label>
        <select required>
            <option value="">Select Course</option>
            <option>Data Science</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>AI and Machine Learning</option>
        </select>

        <button type="submit">Submit</button>

    </form>

</div>

</body>
</html>
